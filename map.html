async function unlock(e){
  e.preventDefault();
  const btn=document.getElementById('btn'), err=document.getElementById('err');
  err.textContent=''; btn.disabled=true; btn.textContent='Entschlüssele…';
  try{
    const pw=document.getElementById('pw').value;
    const km=await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key=await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64(SALT), iterations:ITER, hash:'SHA-256'}, km,
      {name:'AES-GCM', length:256}, false, ['decrypt']);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(IV)}, key, b64(CT));
    const html=new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  }catch(err2){
    document.getElementById('err').textContent='Falsches Codewort.';
    btn.disabled=false; btn.textContent='Entsperren';
  }
  return false;
}
